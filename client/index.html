<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta
      name="description"
      content="LocalLens — private, local document intelligence. Ask your documents and follow the sources."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const t = localStorage.getItem('locallens-theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>LocalLens — Your knowledge, in focus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
